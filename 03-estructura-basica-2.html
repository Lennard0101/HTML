<!-- 
 
Para crear la estructura básica podemos usar Emmet

Emmet es una herramienta de autocompletado integrada en VSC.

El short para escribir la estructura: !

Atributos

lang 👉 Determina el idioma en el que esta escrito el documento 
charset 👉 Determina el conjunto de caracteres que se utilizará en el documento

Etiquetas

Viewport 👉 Permite que nuestro documento se vea correctamente en dispositivos móviles. Siempre debe de estar.

Title 👉 Define el título de nuestro documento. Este título si es visible para el usuario y se ubica en las pestaña del navegador.

-->

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ya se viene mi Cumpleaños 🥳</title>
</head>
<body>
    
</body>
</html>
