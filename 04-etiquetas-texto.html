<!-- 
 
Etiquetas de Texto

1. Encabezado: van desde h1 hasta h6, siendo h1 el más importante y h6 el menos importante. Se utilizan para títulos y subtítulos. La sintaxis es:

<h1>...</h1> 👉 Solo debe haber una etiqueta en todo el documento.
<h2>...</h2>
<h3>...</h3>
<h4>...</h4>
<h5>...</h5>
<h6>...</h6>

-->

<h1>Título Principal</h1>
<h2>Título Secundario</h2>
<h3>Título Terciario</h3>
<h4>Título de cuarta jerarquía</h4>
<h5>Título de quinta jerarquía</h5>
<h6>Título de sexta jerarquía</h6>

<!--

2. Párrafo: se utiliza para escribir bloques de texto en el documento. La sintaxis es:

<p>...</p>

-->

<p>lorem ipsum<p>
