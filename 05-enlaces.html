<!--

🔗..Enlaces

Los enlaces nos permiten crear navegación interna y externa dentro html. La sintaxis es:

....Sintaxis:

....<a>...</a>

Los Enlaces requieren de un atributo llamado `href` que nos permite que funcionen como elementos interactivos.

....Sintaxis:

....<a href="...">...</a>

El atributo `href` puede recibir diferentes tipos de valores, entre ellos:
👉 URL externa
👉 La ruta (path) de un archivo HTML
👉 El Id de un elemento de HTML
👉 # Deadlink (el enlace muerto)

El artibuto target nos permite abrir un enlace en una nueva pestaña del navegador. Para ello debemos de asignarle el valor `_blank`.

-->

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enlaces</title>
</head>
<body>
