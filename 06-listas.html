<!--

📋..Listas

Las listas nos permiten organizar información de manera jerárquica y no ordenada. Hay tres tipos de listas en HTML:

1. Listas ordenadas: `<ol>...</ol>`
2. Listas no ordenadas: `<ul>...</ul>`
3. Para los elementos de una lista que usa la sintaxis: `<li>...</li>`.

Existe el atributo `type` que nos permite cambiar el tipo de marcador de las listas ordenadas y el bullet de las listas..

Para las listas ordenadas podemos usar los siguientes valores:

1. `1` 👉 Tipo números
2. `A` 👉 Tipo alfabeto
3. `I` 👉 Tipo romano

Para las listas no ordenadas podemos usar los siguientes valores:

1. `disc` 👉 Tipo disco
2. `circle` 👉 Tipo círculo
3. `square` 👉 Tipo cuadrado 
-->

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listas</title>
</head>
<body>
    <h1>Listas ordenadas</h1>
    <p>Tenemos listas ordenadas y no ordenadas.
    
    <h2>Mi comida Favorita</h2>
    <ol type="I">
        <li>Chilaquiles</li>
        <li>Chanclas o Pambazos</li>
        <li>Tacos</li>
    </ol>

    <h2>Mis Pokemons Favoritos</h2>
    <ul type="disc">
        <li>Oshawott</li>
        <li>Rowlet</li>
        <li>Cyndaquil</li>
    </ul>

</body>
</html>
