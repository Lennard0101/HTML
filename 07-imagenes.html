<!--

Imágenes

Para insertar imágenes en un documento HTML se utiliza la etiqueta: 

`<img />`

Esta etiqueta es de autocierre (`selfclosing`). En HTML5, la / al final de la etiqueta es opcional, pero se recomienda utilizarla para una buena práctica.

eL atributo `src` (source u origen) le indica a la etiqueta la imagen a mostrar. Puede recibir una URL externa o la ruta (path) de una interna.

El atributo `alt` (alternative) le indica a la etiqueta un texto alternativo que se mostrará en caso de que la imagen no pueda ser cargada. Este atributo es obligatorio para que se utiliza como apoyo en la accesibilidad web.

Los atributos `width` y `height` le indican a la etiqueta el ancho y alto del HTML.
-->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imágenes</title>
</head>
<body>
    <h1>Imágenes</h1>
    <p>Las imagenes nos permiten agregar contenido visual a nuestro sitio web.</p>

    <h2>Imagenes Externas</h2>
    <img src="https://picsum.photos/200/300" alt="Imagen aleatoria desde Lorem Picsum" />

    <h2>Imagenes Internas</h2>
    <img src="Images/Angry Birds Halloween.jpg" alt="Es una imagen del juego de Angry Birds pero con un tema de Halloween" width="800" height="auto" />
</body>
</html>
