<!--

Contenido incrustado (iframe)

los iframes nos permiten incrustar contenido externo como videos, mapas, documentos, interfaces...

- src: dirección del contenido a incrustar.
- width: ancho del iframe.
- height: alto del iframe.
- allowfullscreen: permite que el contenido incrustado se pueda ver en pantalla completa.

-->

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Iframes </title>
</head>
<body>
    <h1> Iframes </h1>

    <h2> Contenido de Video </h2>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/yNHBbsf_Org?si=hAEPgzQxdiVroP9i" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    <h2> Contenido de Mapa </h2>
    <iframe src="https://www.google.com/maps/embed?pb=!3m2!1ses-419!2smx!4v1792445430415!5m2!1ses-419!2smx!6m8!1m7!1s5CCziJhBkPn5Awa1aZTM-w!2m2!1d19.05105600365032!2d-98.21715954488394!3f6.023921766802118!4f6.0633439340113995!5f0.7820865974627469" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
    <h2> Revista </h2>
    <iframe src="https://heyzine.com/flip-book/383f213883.html#page/1"
</body>
</html>
