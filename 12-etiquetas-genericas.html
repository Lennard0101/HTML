<!--

Etiquetas Genéricas

Existen dos que nos ayudan a crear elementos de tipo bloque y en línea.

div 👉 Se usa como un contenedor de division y semantidcamente no significa nada. Sirve como contender de bloque.

span 👉 Es un contenedor de tipo línea, se suele usar para encerrar palabras o pequeños textos. Semanticamente no significa nada.

Contenedor de Bloque - ocupan todo el ancho disponible y siempre empiezan en una nueva línea.

Contenedor de Línea - ocupan solo el ancho de su contenido y no empiezan en una nueva línea.

-->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Etiquetas Genéricas </title>
</head>
<body>
    <h1> Etiquetas Genéricas </h1>

    <div>
        ¡Este es un <span style="color:aqua">elemento</span> de bloque!
    </div>

    <div>
        ¡Este es otro elemento de bloque! <span> Y este es otro elemento de línea </span>
    </div>
</body>
</html>
